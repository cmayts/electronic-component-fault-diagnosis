[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electronic-component-fault-diagnosis"
version = "1.0.0"
description = "Measurement-based fault diagnosis for common electronic components"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
component-diagnostics = "component_diagnostics.cli:main"

[tool.setuptools.packages.find]
include = ["component_diagnostics*"]
